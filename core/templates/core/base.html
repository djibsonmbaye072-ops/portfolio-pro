{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#020617">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>{% block title %}DJIBRIL MBAYE{% endblock %}</title>

<!-- GLOBAL CSS -->
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<!-- ICONES -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#070d1a;
    --text:#ffffff;
    --nav:rgba(2,6,23,0.7);
}

body.light{
    --bg:#f8fafc;
    --text:#0f172a;
    --nav:rgba(255,255,255,0.7);
}

body{
    font-family:'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:0.3s;
    overflow-x:hidden;
    width:100%;
}

/* =========================
   NAVBAR
========================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 5%;
    z-index:1000;
    transition:0.3s;
}

.navbar.scrolled{
    background:var(--nav);
    backdrop-filter:blur(10px);
}

.logo{
    font-weight:700;
    font-size:18px;
    white-space:nowrap;
}

/* =========================
   MENU
========================= */

.nav-links{
    display:flex;
    align-items:center;
}

.nav-links a{
    margin-left:25px;
    color:#cbd5f5;
    text-decoration:none;
    font-weight:500;
    transition:.3s;
}

.nav-links a:hover{
    color:#38bdf8;
}

.menu-toggle{
    display:none;
    font-size:22px;
    cursor:pointer;
}

/* =========================
   PAGE
========================= */

.page{
    margin-top:100px;
    opacity:0;
    transform:translateY(30px);
    animation:pageEnter .8s ease forwards;
}

@keyframes pageEnter{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   LOADER
========================= */

#loader{
    position:fixed;
    width:100%;
    height:100%;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.loader-text{
    font-size:22px;
    letter-spacing:3px;
    animation:blink 1s infinite alternate;
}

@keyframes blink{
    from{
        opacity:.3;
    }
    to{
        opacity:1;
    }
}

/* =========================
   DARK MODE BUTTON
========================= */

.toggle{
    margin-left:20px;
    padding:8px 12px;
    border-radius:8px;
    background:#38bdf8;
    border:none;
    cursor:pointer;
    color:white;
    font-size:16px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    .navbar{
        padding:15px 20px;
    }

    .logo{
        font-size:15px;
        max-width:70%;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .menu-toggle{
        display:block;
        font-size:28px;
        color:white;
        z-index:1001;
    }

    .nav-links{
        position:fixed;
        top:0;
        right:-100%;
        width:280px;
        height:100vh;
        background:#020617;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        gap:25px;
        transition:.4s ease;
        display:flex;
        padding:40px;
        box-shadow:-10px 0 40px rgba(0,0,0,.5);
    }

    .nav-links.active{
        right:0;
    }

    .nav-links a{
        margin:0;
        font-size:18px;
    }

    .toggle{
        margin-left:0;
        margin-top:10px;
    }
}

</style>

</head>

<body>

<!-- =========================
     LOADER
========================= -->

<div id="loader">
    <div class="loader-text">
        DJIBRIL MBAYE
    </div>
</div>

<!-- =========================
     NAVBAR
========================= -->

<header class="navbar" id="navbar">

    <div class="logo">
        DJIBRIL MBAYE
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">
        <i class="fa-solid fa-bars"></i>
    </div>

    <nav class="nav-links" id="navLinks">

        <a href="{% url 'home' %}">
            <i class="fa-solid fa-house"></i>
            Accueil
        </a>

        <a href="{% url 'about' %}">
            <i class="fa-solid fa-user"></i>
            Présentation
        </a>

        <a href="{% url 'experience' %}">
            <i class="fa-solid fa-briefcase"></i>
            Expériences
        </a>

        <a href="{% url 'projects' %}">
            <i class="fa-solid fa-diagram-project"></i>
            Réalisations
        </a>

        <a href="{% url 'skills' %}">
            <i class="fa-solid fa-bolt"></i>
            Compétences
        </a>

        <a href="{% url 'roman' %}">
            <i class="fa-solid fa-book"></i>
            Roman
        </a>

        <button class="toggle" onclick="toggleMode()">
            🌙
        </button>

    </nav>

</header>

<!-- =========================
     CONTENT
========================= -->

<div class="page">

{% block content %}
{% endblock %}

</div>

<script>

/* =========================
   MENU MOBILE
========================= */

function toggleMenu(){
    document.getElementById("navLinks")
    .classList.toggle("active");
}

document.querySelectorAll(".nav-links a").forEach(link=>{
    link.addEventListener("click",()=>{
        document.getElementById("navLinks")
        .classList.remove("active");
    });
});

/* =========================
   LOADER
========================= */

window.addEventListener("load",()=>{

    const loader=document.getElementById("loader");

    setTimeout(()=>{
        loader.style.display="none";
    },500);

});

/* =========================
   NAVBAR SCROLL
========================= */

window.addEventListener("scroll",()=>{

    document
    .getElementById("navbar")
    .classList.toggle(
        "scrolled",
        window.scrollY > 50
    );

});

/* =========================
   DARK MODE
========================= */

function toggleMode(){

    document.body.classList.toggle("light");

}

/* =========================
   PAGE TRANSITION
========================= */

document.querySelectorAll("a").forEach(link=>{

    link.addEventListener("click",function(e){

        const href=this.getAttribute("href");

        if(
            !href ||
            href.startsWith("#") ||
            href.startsWith("http")
        ){
            return;
        }

        e.preventDefault();

        gsap.to(".page",{
            opacity:0,
            y:30,
            duration:0.4,
            onComplete:()=>{
                window.location.href=href;
            }
        });

    });

});

/* =========================
   CLOSE MENU OUTSIDE CLICK
========================= */

document.addEventListener("click",(e)=>{

    const nav=document.getElementById("navLinks");
    const burger=document.querySelector(".menu-toggle");

    if(
        !nav.contains(e.target) &&
        !burger.contains(e.target)
    ){
        nav.classList.remove("active");
    }

});

</script>

</body>
</html>
