{% extends 'core/base.html' %}
{% load static %}

{% block title %}Réalisations{% endblock %}

{% block content %}

<style>

/* ================= BACKGROUND ================= */

.bg{
    background:
    radial-gradient(circle at 10% 20%, rgba(56,189,248,0.15), transparent),
    radial-gradient(circle at 90% 80%, rgba(99,102,241,0.15), transparent),
    #020617;
    min-height:100vh;
}

/* ================= CONTAINER ================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:120px 20px;
}

/* ================= TITLE ================= */

.title{
    text-align:center;
    margin-bottom:60px;
}

.title h1{
    font-size:60px;
    font-weight:900;
    background:linear-gradient(to right,#38bdf8,#6366f1);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* ================= FILTERS ================= */

.filters{
    text-align:center;
    margin-bottom:50px;
}

.filter-btn{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:20px;
    background:#1e293b;
    color:#cbd5f5;
    cursor:pointer;
    transition:.3s;
    font-weight:600;
}

.filter-btn.active,
.filter-btn:hover{
    background:#38bdf8;
    color:#000;
}

/* ================= GRID ================= */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:30px;
}

/* ================= CARD ================= */

.card{
    background:rgba(255,255,255,0.04);
    border-radius:20px;
    overflow:hidden;
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.05);
    transition:.4s;
    position:relative;

    display:flex;
    flex-direction:column;
    height:100%;
}

/* ================= IMAGE ================= */

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

/* ================= CONTENT ================= */

.card-content{
    padding:20px;
    display:flex;
    flex-direction:column;
    flex:1;
}

.card h3{
    margin-bottom:10px;
    color:#fff;
    font-size:22px;
}

.card p{
    color:#94a3b8;
    font-size:14px;
    line-height:1.7;

    flex:1;

    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

/* ================= HOVER ================= */

.card::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:
    radial-gradient(
        circle,
        rgba(56,189,248,0.2),
        transparent 60%
    );
    opacity:0;
    transition:.4s;
}

.card:hover::before{
    opacity:1;
}

.card:hover{
    transform:translateY(-10px) scale(1.02);
}

/* ================= BUTTON ================= */

.btn{
    display:inline-block;
    margin-top:15px;
    padding:10px 18px;
    background:#38bdf8;
    color:#000;
    border-radius:10px;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    transition:.3s;
}

.btn:hover{
    background:#0ea5e9;
    transform:translateY(-2px);
}

/* ================= ANIMATION ================= */

.fade{
    opacity:0;
    transform:translateY(40px);
    transition:1s;
}

.fade.show{
    opacity:1;
    transform:translateY(0);
}

/* ================= MOBILE PROJECTS ================= */

@media(max-width:768px){

    .container{
        padding:100px 15px 60px;
    }

    .title{
        margin-bottom:40px;
    }

    .title h1{
        font-size:38px;
    }

    .filters{
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:10px;
        margin-bottom:35px;
    }

    .filter-btn{
        padding:12px 18px;
        font-size:14px;
        min-width:90px;
    }

    .grid{
        grid-template-columns:1fr;
        gap:20px;
    }

    .card img{
        height:220px;
    }

    .card-content{
        padding:18px;
    }

    .card h3{
        font-size:20px;
    }

    .card p{
        font-size:15px;
        line-height:1.6;
    }

    .btn{
        width:100%;
        text-align:center;
        padding:12px;
        font-size:15px;
    }
}

@media(max-width:480px){

    .title h1{
        font-size:30px;
    }

    .card img{
        height:180px;
    }

    .card-content{
        padding:15px;
    }

    .card h3{
        font-size:18px;
    }

    .card p{
        font-size:14px;
    }
}

</style>

<div class="bg">

    <div class="container">

        <!-- TITLE -->
        <div class="title fade">
            <h1>Réalisations</h1>
        </div>

        <!-- FILTERS -->
        <div class="filters fade">
            <button class="filter-btn active" data-filter="all">Tout</button>
            <button class="filter-btn" data-filter="web">Web</button>
            <button class="filter-btn" data-filter="bio">Biomédical</button>
            <button class="filter-btn" data-filter="other">Autres</button>
        </div>

        <!-- PROJECTS -->
        <div class="grid">

            {% for project in projects %}
            <div class="card fade"
                 data-category="{{ project.category|default:'web' }}">

                <img src="{{ project.image.url }}"
                     alt="{{ project.title }}">

                <div class="card-content">

                    <h3>{{ project.title }}</h3>

                    <p>
                        {{ project.description }}
                    </p>

                    <a href="{% url 'project_detail' project.id %}"
                       class="btn">
                        Voir détails
                    </a>

                </div>

            </div>
            {% endfor %}

        </div>

    </div>

</div>

<script>

/* ================= SCROLL ANIMATION ================= */

const elements = document.querySelectorAll('.fade');

function revealElements() {

    const trigger = window.innerHeight * 0.85;

    elements.forEach(el => {

        if(el.getBoundingClientRect().top < trigger){
            el.classList.add('show');
        }

    });
}

window.addEventListener('scroll', revealElements);
window.addEventListener('load', revealElements);

/* ================= FILTER ================= */

const buttons = document.querySelectorAll('.filter-btn');
const cards = document.querySelectorAll('.card');

buttons.forEach(btn => {

    btn.addEventListener('click', () => {

        document
            .querySelector('.filter-btn.active')
            .classList
            .remove('active');

        btn.classList.add('active');

        const filter = btn.dataset.filter;

        cards.forEach(card => {

            if(
                filter === "all" ||
                card.dataset.category === filter
            ){
                card.style.display = "flex";
            }
            else{
                card.style.display = "none";
            }

        });

    });

});

</script>

{% endblock %}
